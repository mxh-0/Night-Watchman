# Render blueprint for the agent API.
#
# The dashboard is a static Next.js app and deploys to Vercel; this is the
# long-running half — the poll loop, the REST API, and the WebSocket the
# Activity feed subscribes to.
#
# Secrets are NOT in this file. Set them in the Render dashboard under
# Environment (see `sync: false` below — Render prompts for each one).
services:
  - type: web
    name: lamplighter-agent
    runtime: node
    plan: free
    rootDir: agent
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/activity
    envVars:
      # --- set these by hand in the Render dashboard ---
      - key: THE_GRAPH_API_KEY
        sync: false
      - key: AGENT_PRIVATE_KEY
        sync: false

      # --- safe to commit ---
      - key: GRAPH_MODE
        value: live
      - key: AGENT_NETWORK
        value: arc
      - key: ARC_TESTNET_RPC_URL
        value: https://rpc.testnet.arc.network
      - key: DEMO_USER_ADDRESS
        value: "0x867b93045Ad26db454bEc0ecb52759Bb0126Ac50"
